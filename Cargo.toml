[package]
name = "codebro"
version = "0.1.0"
edition = "2021"
description = "Your AI coding partner in the terminal"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream", "bracketed-paste"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
pulldown-cmark = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
futures = "0.3"
dirs = "5"
async-trait = "0.1"
tempfile = "3"
regex = "1"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-go = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.9.0"
ansi-to-tui = "4.1.0"
libc = "0.2.189"
rmcp = { version = "3.1.2", features = ["transport-io"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "codebro"
path = "src/main.rs"
