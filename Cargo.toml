[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "CodeBro — engineering intelligence runtime for AI coding agents"

[workspace.dependencies]
# Internal crates (dependency direction: mcp-server -> services -> parsers/core)
codebro-core = { path = "crates/core" }
codebro-parsers = { path = "crates/parsers" }
codebro-fact-store = { path = "crates/fact-store" }
codebro-identity-runtime = { path = "crates/identity-runtime" }
codebro-memory-runtime = { path = "crates/memory-runtime" }
codebro-sandbox-runtime = { path = "crates/sandbox-runtime" }
codebro-impact-engine = { path = "crates/impact-engine" }
codebro-indexer = { path = "crates/indexer" }
codebro-change-engine = { path = "crates/change-engine" }
codebro-context-runtime = { path = "crates/context-runtime" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
libc = "0.2.189"
portable-pty = "0.9.0"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "cookies"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
rusqlite = { version = "0.31", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tree-sitter = "0.20"
tree-sitter-go = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-typescript = "0.20"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
